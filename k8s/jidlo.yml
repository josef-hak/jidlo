apiVersion: v1
kind: Service
metadata:
  name: jidlo
spec:
  ports:
    - port: 80
      targetPort: 8084
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jidlo
subsets:
  - addresses:
      - ip: 172.17.0.1
    ports:
      - port: 8084
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jidlo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jidlo.jhak.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jidlo
                port:
                  number: 80
  tls:
    - hosts:
        - jidlo.jhak.cz
      secretName: jidlo-tls
