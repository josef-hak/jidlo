<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/imgs/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <title>{{ if .IsHome }}{{ .Site.Title }} — Katalog potravin{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
</head>
<body>

<header class="site-header">
    <a href="/" class="site-title">{{ .Site.Title }}</a>
    {{ if .IsHome }}
    <div class="site-header-actions">
        <button class="header-btn" id="filter-toggle" title="Kategorie">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="8" y1="18" x2="16" y2="18"/></svg>
        </button>
        <div class="header-sort-wrap" id="sort-wrap">
            <button class="header-btn" id="sort-toggle" title="Řazení">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4v16m0 0l-3-3m3 3l3-3M17 20V4m0 0l3 3m-3-3l-3 3"/></svg>
            </button>
            <div class="catalog-sort-menu" id="sort-menu">
                <button class="sort-option" data-sort="kcal">kcal</button>
                <button class="sort-option" data-sort="bilk">bílkoviny</button>
                <button class="sort-option" data-sort="sach">sacharidy</button>
                <button class="sort-option" data-sort="tuky">tuky</button>
            </div>
        </div>
        <button class="header-btn" id="rozpis-toggle" title="Rozpis">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
    </div>
    {{ end }}
</header>

<main class="site-content">
    {{ block "main" . }}{{ end }}
</main>

<footer class="site-footer">
    <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
</footer>

</body>
</html>
